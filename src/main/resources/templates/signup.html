<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="base::Layout(~{::section})">
<head>
    <!-- <meta charset="UTF-8"> -->
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <title th:text="${title}"></title>
    
</head>
<body>

    <section>
        
        <div class="container">
            <div class="row">

                <div class="col-md-8 offset-md-2">
                    <div class="my-card mt-2" >

                        <div th:if="${session.message}" th:classappend="${session.message.type}" class="alert" role="alert">
                            <p th:text="${session.message.content}"></p>
                            <!-- <th:block th:text="${#session.removeAttribute('message')}"></th:block> -->
                        </div>

                        <div class="container text-center">
                            <img style="width: 80px;" th:src="@{/img/contact-form.png}" alt="" class="src">
                        </div>
                        <h1 class="text-center">SignUp Here !!</h1>
                        <form novalidate th:action="@{/do_registration}" th:object="${user}" method="post">
                            
                            <!-- name_field -->
                            <div class="form-group">
                                <label for="name_field">Your Name</label>
                                <!-- th:field="*{name}",name="name" -->

                                <input

                                    
                                    name="name"
                                    type="text" 
                                    class="form-control"
                                    th:classappend="*{#fields.hasErrors('name') ? 'is-invalid' : ''}" 
                                    id="name_field" 
                                    aria-describedby="emailHelp" 
                                    placeholder="enter here"
                                    required
                                    th:value="${user.name}">

                                    <!-- <div th:if="*{#fields.hasErrors('name')}" class="invalid-feedback">
                                        <span th:errors="*{name}"></span>
                                    </div> -->
                                    <div th:each="e : *{#fields.errors('name')}" th:text="${e}"  class="invalid-feedback">

                                    </div>
                            </div>

                            <!-- email field -->
                            <div class="form-group">
                                <label for="email_field">Your Email</label>

                                <input 
                                    name="email"
                                    type="email" 
                                    class="form-control" 
                                    id="email_field" 
                                    aria-describedby="emailHelp" 
                                    placeholder="enter here"
                                    required
                                    th:value="${user.email}">
                            </div>

                            <!-- password field -->
                            <div class="form-group">
                                <label for="password_field">Your Password</label>

                                <input
                                    name="password" 
                                    type="password" 
                                    class="form-control" 
                                    id="password_field" 
                                    aria-describedby="emailHelp" 
                                    placeholder="enter here"
                                    required>
                            </div>

                            <!-- about field -->
                            <div class="form-group">
                                <textarea
                                    name="about"
                                    rows="5"
                                    class="form-control"
                                    placeholder="enter somthing about your self"
                                    th:text="${user.about}"></textarea>
     
                            </div>

                            <!-- terms and condition agreement -->
                             <div class="form-group form-check text-center">
                                <input
                                    type="checkbox"
                                    name="agreement"
                                    class="form-check-input"
                                    id="agreement"
                                />
                                <label for="agreement">Accept terms and conditions</label>


                             </div>


                            <div class="container text-center">
                                <button type="submit" class="btn bg-primary text-white">Submit</button>
                                <button type="reset" class="btn bg-primary text-white">Reset</button>
                            </div>


                        </form>

                    </div>
                    
                </div>
            </div>
        </div>
    </section>

    
</body>
</html>
