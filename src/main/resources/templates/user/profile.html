<!DOCTYPE html>
<html 
    lang="en" 
    xmlns:th="http://www.thymeleaf.org" 
    th:replace="~{base::parent(~{::#content}, ~{::title},~{::script})}">
    <!-- th:replace="base::Layout(~{::#tagid})"  if multiple same name tag via id -->
     <!-- th:replace="base::Layout(~{::.classid})"  if multiple same name tag via class name-->
      <!-- <div class="host-tag" th:replace="${isActive} ? ~{base::frag1(~{::section} : ~${base::frag2(~{::block})})}"></div> -->
<head>
    <!-- <meta charset="UTF-8"> -->
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0"> -->
    <title th:text="${loggedInUser.name}+' | SCM2'"></title>
    
</head>
<body>

 

    
    <div id="content" >

        <!-- sidebar starts -->
        <!-- only when user loggedin -->
        <div th:if="${loggedInUser}">
            <div th:replace="~{user/sidebar :: sidebar}"></div>
        </div>
        <!-- sidebar ends -->


        <div class="sm:pl-64 pt-10" style="height: 1000px">
            <div class="flex items-center justify-center md:pt-32 flex-col">
                
                 <!-- profie card -->
                <div class="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-lg max-w-2xl w-full">
                    <div class="flex flex-col items-center">
                        <img data-th-src="@{${loggedInUser.profilePic}}" onerror="this.onerror=null; this.src='https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQBkA9WO3FnL4fddebhCcTztCr6vr2METdo9w&s'" alt="Profile Photo" class="w-44 h-44 rounded-full  object-cover mb-4">
                        <h2 class="text-2xl font-semibold mb-2" data-th-text=${loggedInUser.name}>User Name</h2>
                        <p class="text-gray-600 mb-2" data-th-text="${loggedInUser.email}">user.email@example.com</p>
                        <p class="text-gray-600 mb-2" data-th-text="${loggedInUser.phoneNumber}">123-456-7890</p>
                        <p class="text-gray-600 mb-4 text-center" data-th-text="${loggedInUser.about}">About the user...</p>
                        <div class="w-full flex justify-between">
                            <p class="text-sm text-gray-500">Email Verified: <span class="font-medium text-gray-700"  th:text="${loggedInUser.emailVerified ? 'YES':'NO'}"></span></p>
                            <p class="text-sm text-gray-500">Phone Verified: <span class="font-medium text-gray-700"  th:text="${loggedInUser.phoneVerified ? 'YES':'NO'}"></span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
    </div>

 

    <script>
        console.log("this is a profile Page");
    </script>

    
</body>
</html>
