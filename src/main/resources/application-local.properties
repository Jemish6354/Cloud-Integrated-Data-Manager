spring.application.name=Smart Contact Manager


# mysql configurations
spring.datasource.name=scm2
spring.datasource.url=jdbc:mysql://localhost:3306/scm2
spring.datasource.username=
spring.datasource.password=

# jpa configurations
#1 spring.jpa.show-sql=true (show sql queries in console) (optional)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#3jpa give queries to db  (optional)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
#5create tables and schema automatic 
spring.jpa.hibernate.ddl-auto=update
# show queries in console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


#security configuration (set default)
# spring.security.user.name=jemish
# spring.security.user.password=jemish
# logging.level.org.springframework.security=DEBUG

# oauth2 client

# google cinfigure
# spring.security.oauth2.client.registration.google.client-name=google
spring.security.oauth2.client.registration.google.client-id=
spring.security.oauth2.client.registration.google.client-secret=
spring.security.oauth2.client.registration.google.scope=email,profile

# github configure
# spring.security.oauth2.client.registration.github.client-name=github
spring.security.oauth2.client.registration.github.client-id=
spring.security.oauth2.client.registration.github.client-secret=
spring.security.oauth2.client.registration.github.scope=email,profile

# cloudinary configure
cloudinary.cloud.name=
cloudinary.api.key=
cloudinary.api.secret=

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# email configurations
spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.domain_name=
